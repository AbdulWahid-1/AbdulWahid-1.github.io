name: Sync Certifications

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Fetch Google badges
        env:
          PROFILE_URL: "https://www.skills.google/public_profiles/82e7e9f7-13dc-49c3-a07e-cf79a087aa8c"
        run: python scripts/fetch_google_badges.py "$PROFILE_URL" data/google-badges.json

      - name: Fetch Credly badges
        env:
          CREDLY_URL: "https://www.credly.com/users/abdul-wahid.cc040eba"
        run: python scripts/fetch_credly_badges.py "$CREDLY_URL" data/credly-badges.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/google-badges.json data/credly-badges.json
          git diff --cached --quiet || git commit -m "chore: sync automated badges"
          git push